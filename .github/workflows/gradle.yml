name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Gradle test
        run: >-
          gradle test
          --show-version
          --no-daemon
          --parallel
          --write-locks
          -Pkotlin-lang.version=2.4.0-Beta2
          -Pkotlin-coroutines.version=1.11.0-rc01
          -Pkotlin-logging.version=8.0.01
          -Pspring-boot.version=4.1.0-RC1
          -Pspring-dm.version=1.1.7
